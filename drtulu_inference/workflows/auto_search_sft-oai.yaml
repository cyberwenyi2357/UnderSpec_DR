tool_parser: "v20250824"

# Client config for the SearchAgent (OpenAI API)
search_agent_model_name: "gpt-4o-2024-08-06"
search_agent_api_key: ${oc.env:OPENAI_API_KEY}
search_agent_max_tokens: 16384 # gpt-4o-2024-08-06 supports at most 16384 completion tokens
search_agent_temperature: 1
search_agent_max_tool_calls: 10
search_agent_reasoning_effort: null # gpt-4o does not support reasoning_effort

# Client config for the browse/reader agent (general model)
use_browse_agent: false
browse_agent_model_name: "gpt-4o-2024-08-06"
browse_agent_api_key: ${oc.env:OPENAI_API_KEY}
browse_agent_max_tokens: 16384 # gpt-4o-2024-08-06 supports at most 16384 completion tokens
browse_agent_temperature: 1
browse_agent_reasoning_effort: null # gpt-4o does not support reasoning_effort

# Search tool configuration
number_documents_to_search: 10
search_timeout: 60

# Browse tool configuration
browse_tool_name: "jina"
browse_timeout: 60
browse_max_pages_to_fetch: 10
browse_context_char_length: 6000

# ask_user: first JSON object in this file supplies clarified_query (and optional type) for UserSimulator
query_template_jsonl: query_template.jsonl
# Use ``query`` from that object as the task (ignore text typed in the UI)
use_query_from_template: false

# When a batch row has no ``clarified_query`` (e.g. type=clear), still wire UserSimulator
# so ``ask_user`` gets LLM replies instead of the stub. Requires OPENAI_API_KEY.
ask_user_use_default_simulator_prompt: true
ask_user_simulator_model: "gpt-5.4-mini-2026-03-17"

# MCP backend (must match MCP_TRANSPORT_PORT in .env)
mcp_port: 8001